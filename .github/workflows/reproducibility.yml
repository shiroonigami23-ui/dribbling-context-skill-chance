name: Reproducibility check

# On every push: every script compiles, the Study 1 data are re-downloaded from StatsBomb open data,
# Study 1 is re-fitted, and its numbers are compared with the committed results.
# The full pipeline (all six studies, ~1 h) is code/run_all.sh.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  study1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile every script
        run: python -m py_compile src/*.py
      - name: Download Study 1 data
        run: python src/fetch.py
      - name: Re-fit Study 1
        run: python src/analysis.py
      - name: Compare with committed results
        run: python src/check_reproduction.py --files summary.json
