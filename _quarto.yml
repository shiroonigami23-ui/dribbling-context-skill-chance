project:
  type: manuscript
  render:
    - index.qmd

execute:
  freeze: auto

format:
  html:
    notebook-links: false
    notebook-view: false
    toc: true
    comments:
      hypothesis: true
    template-partials:
      - _extensions/quarto-journals/jasa/partials/title-metadata.html
  jasa-pdf:
    notebook-links: false
    notebook-view: false
    keep-tex: true
    pdf-engine: pdflatex
